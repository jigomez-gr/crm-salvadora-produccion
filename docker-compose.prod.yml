# Production stack for Dokploy (deployment type: "Docker Compose").
#
# This file deploys the CRM Salvadora app on Dokploy / Docker:
# - Database (Postgres) with safe fallback defaults
# - API (NestJS + Mastra + TypeORM) on :3001
# - Web (Next.js 16) on :3000
#
# Supports BOTH single-domain (e.g. crm-salvadoraconesa.jigretera.com)
# and multi-domain (web + api subdomains) with automatic SSL via Traefik.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_salvadora}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-W39xlpS9}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crm_salvadora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      # Connects to external DATABASE_URL if set, otherwise internal db service.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-W39xlpS9}@db:5432/${POSTGRES_DB:-crm_salvadora}}
      # The deployed frontend origin, so the browser is allowed to call the API.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${WEB_DOMAIN:-crm-salvadoraconesa.jigretera.com}}
      PORT: "3001"
      # ─── Authentication (login + roles) ───
      JWT_SECRET: ${JWT_SECRET:-super-secret-crm-key-39xlps9-jwt-token-2026}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@crmsalvadora.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Madrid}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # ─── Stripe Payments ───
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # ─── Business Email SMTP ───
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Centro de Yoga Salvadora Conesa}
      ANALIZA_IA_URL: ${ANALIZA_IA_URL:-https://analizaia.jigretera.com/api/dental/analizar}
      # ─── AI Model & WhatsApp (UI configurables) ───
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-4o-mini}
      YCLOUD_API_KEY: ${YCLOUD_API_KEY:-}
      YCLOUD_WEBHOOK_SECRET: ${YCLOUD_WEBHOOK_SECRET:-}
      YCLOUD_WHATSAPP_NUMBER: ${YCLOUD_WHATSAPP_NUMBER:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/healthz/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTP -> HTTPS redirect
      - traefik.http.routers.crm-api-http.rule=Host(`${API_DOMAIN:-${WEB_DOMAIN:-crm-salvadoraconesa.jigretera.com}}`) && (PathPrefix(`/api`) || PathPrefix(`/healthz`))
      - traefik.http.routers.crm-api-http.entrypoints=web
      - traefik.http.routers.crm-api-http.middlewares=crm-api-redirect
      - traefik.http.middlewares.crm-api-redirect.redirectscheme.scheme=https
      # HTTPS (Let's Encrypt cert issued automatically)
      - traefik.http.routers.crm-api.rule=Host(`${API_DOMAIN:-${WEB_DOMAIN:-crm-salvadoraconesa.jigretera.com}}`) && (PathPrefix(`/api`) || PathPrefix(`/healthz`))
      - traefik.http.routers.crm-api.entrypoints=websecure
      - traefik.http.routers.crm-api.tls.certresolver=letsencrypt
      - traefik.http.routers.crm-api.priority=100
      - traefik.http.services.crm-api.loadbalancer.server.port=3001

  web:
    build:
      context: ./frontend
      args:
        # Defaults to the public domain URL so the frontend can call /api seamlessly
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-${WEB_DOMAIN:-crm-salvadoraconesa.jigretera.com}}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTP -> HTTPS redirect
      - traefik.http.routers.crm-web-http.rule=Host(`${WEB_DOMAIN:-crm-salvadoraconesa.jigretera.com}`)
      - traefik.http.routers.crm-web-http.entrypoints=web
      - traefik.http.routers.crm-web-http.middlewares=crm-web-redirect
      - traefik.http.middlewares.crm-web-redirect.redirectscheme.scheme=https
      # HTTPS (Let's Encrypt cert issued automatically)
      - traefik.http.routers.crm-web.rule=Host(`${WEB_DOMAIN:-crm-salvadoraconesa.jigretera.com}`)
      - traefik.http.routers.crm-web.entrypoints=websecure
      - traefik.http.routers.crm-web.tls.certresolver=letsencrypt
      - traefik.http.routers.crm-web.priority=10
      - traefik.http.services.crm-web.loadbalancer.server.port=3000

volumes:
  postgres_data:

networks:
  internal:
  dokploy-network:
    external: true
