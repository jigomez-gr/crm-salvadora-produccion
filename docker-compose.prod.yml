# Production stack for Dokploy (deployment type: "Docker Compose").
#
# Traefik routing is configured directly via container labels
# bypassing Dokploy's UI domain IP verification.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_salvadora}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-W39xlpS9}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-W39xlpS9}@db:5432/${POSTGRES_DB:-crm_salvadora}}
      CORS_ORIGIN: "*"
      PORT: "3001"
      # ─── Authentication (login + roles) ───
      JWT_SECRET: ${JWT_SECRET:-super-secret-crm-key-39xlps9-jwt-token-2026}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@crmsalvadora.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Madrid}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # ─── Stripe Payments ───
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # ─── Business Email SMTP ───
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Centro de Yoga Salvadora Conesa}
      ANALIZA_IA_URL: ${ANALIZA_IA_URL:-https://analizaia.jigretera.com/api/dental/analizar}
      # ─── AI Model & WhatsApp (UI configurables) ───
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-4o-mini}
      YCLOUD_API_KEY: ${YCLOUD_API_KEY:-}
      YCLOUD_WEBHOOK_SECRET: ${YCLOUD_WEBHOOK_SECRET:-}
      YCLOUD_WHATSAPP_NUMBER: ${YCLOUD_WHATSAPP_NUMBER:-}
    networks:
      - internal
      - dokploy-network

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      INTERNAL_API_URL: http://api:3001
      NODE_ENV: production
      PORT: "3000"
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTP (Port 80)
      - "traefik.http.routers.crm-salvadora-web-http.rule=Host(`crm-salvadoraconesa.jigretera.com`)"
      - "traefik.http.routers.crm-salvadora-web-http.entrypoints=web"
      # HTTPS (Port 443)
      - "traefik.http.routers.crm-salvadora-web.rule=Host(`crm-salvadoraconesa.jigretera.com`)"
      - "traefik.http.routers.crm-salvadora-web.entrypoints=websecure"
      - "traefik.http.routers.crm-salvadora-web.tls=true"
      - "traefik.http.routers.crm-salvadora-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.crm-salvadora-web.loadbalancer.server.port=3000"

volumes:
  postgres_data:

networks:
  internal:
  dokploy-network:
    external: true
